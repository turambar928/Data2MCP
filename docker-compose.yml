services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "2734:2733"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5160:5173"
    depends_on:
      - backend
    environment:
      BACKEND_PROXY_TARGET: http://backend:2733
    restart: unless-stopped
